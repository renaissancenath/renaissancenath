<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img"><style><![CDATA[@keyframes fin{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:translateX(0)}}.fin{animation:fin .9s ease-out both}@keyframes ring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:.25}}.ring{animation:ring 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(310px)}}.scan{animation:scan 6s linear infinite}]]></style><defs><filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="898" height="298" rx="16" fill="#050b1a" stroke="#12356b" stroke-width="1.5"/><text x="30" y="38" font-family="'Courier New', Courier, monospace" font-size="14" fill="#00f7ff">// RULES I BUILD BY  /* 掟 */</text><g class="fin" style="animation-delay:0.3s"><circle class="ring" cx="78" cy="100" r="31" fill="none" stroke="#00f7ff" stroke-width="2"/><circle cx="78" cy="100" r="25" fill="#00f7ff" fill-opacity=".1"/><text x="78" y="111" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#00f7ff" filter="url(#glow)">証</text><text x="132" y="96" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold" fill="#fff">Show the evidence</text><text x="132" y="120" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#cfe6ff">Every verdict, ranking and fix points to the exact sentence, line or test behind it.</text></g><line x1="132" y1="140" x2="860" y2="140" stroke="#12356b" stroke-dasharray="2 6"/><g class="fin" style="animation-delay:0.8999999999999999s"><circle class="ring" cx="78" cy="178" r="31" fill="none" stroke="#2f8cff" stroke-width="2"/><circle cx="78" cy="178" r="25" fill="#2f8cff" fill-opacity=".1"/><text x="78" y="189" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#2f8cff" filter="url(#glow)">誠</text><text x="132" y="174" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold" fill="#fff">Say "unknown" out loud</text><text x="132" y="198" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#cfe6ff">Not enough evidence? The product says so. A label stays off because it was right too rarely.</text></g><line x1="132" y1="218" x2="860" y2="218" stroke="#12356b" stroke-dasharray="2 6"/><g class="fin" style="animation-delay:1.5s"><circle class="ring" cx="78" cy="256" r="31" fill="none" stroke="#4df0c8" stroke-width="2"/><circle cx="78" cy="256" r="25" fill="#4df0c8" fill-opacity=".1"/><text x="78" y="267" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#4df0c8" filter="url(#glow)">守</text><text x="132" y="252" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="bold" fill="#fff">Gate the dangerous stuff</text><text x="132" y="276" font-family="'Courier New', Courier, monospace" font-size="12.5" fill="#cfe6ff">Destructive changes need a backup, a typed confirmation and a person who approves.</text></g><rect class="scan" x="2" width="896" height="3" fill="#00f7ff" opacity=".12"/></svg>